name: Bug
description: Algo quebrou no pipeline, num script ou na instalação.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Pode escrever em português ou em inglês (English is welcome).

        Antes de colar log ou comando, tire chaves, tokens e qualquer texto que você não quer público (roteiro, marca, nome de cliente). Não anexe gravação de voz nem vídeo de outra pessoa.

  - type: dropdown
    id: step
    attributes:
      label: Etapa do pipeline
      description: Onde o erro aparece. As etapas estão no SKILL.md da motion-cena.
      options:
        - Instalação (setup.sh, setup.ps1)
        - 0. Brief
        - 1. Formato narrativo
        - 2. Roteiro e hooks
        - 2.5. Ideia central
        - 3. Storyboard
        - 4. Identidade visual (marca, fontes, ícones)
        - 5. Locução e timestamps (TTS, align_words, build_timeline)
        - 6. Animação (HyperFrames, zona segura)
        - 7. Som (efeitos, mix)
        - 8. Render e QA
        - Carrossel
        - Interface tools/studio
        - Script rodado direto, fora do pipeline
        - Não sei
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: O que você pediu ao agente, o que esperava e o que saiu.
      placeholder: |
        Pedi "faz um reels de 30 s sobre juros compostos". Na etapa de locução o agente rodou o tts_edge.py e parou com erro.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Comando
      description: O comando que falhou, como o agente mostrou ou como você rodou.
      render: shell
      placeholder: uv run .agents/skills/motion-cena/scripts/tts_edge.py --text-file projects/juros/narration.txt --voice pt-BR-FranciscaNeural --out projects/juros/audio
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Texto do erro
      description: A saída completa do erro, sem print de tela.
      render: text
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agente
      options:
        - Claude Code
        - Codex
        - Antigravity
        - Cursor
        - GitHub Copilot
        - OpenCode
        - Windsurf
        - Gemini CLI
        - Outro (diga qual em "Mais contexto")
        - Nenhum, rodei o script direto
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema
      options:
        - Linux
        - macOS
        - Windows (PowerShell)
        - Windows (WSL)
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versões
      description: |
        Versão do sistema e a saída de `node --version`, a primeira linha de `ffmpeg -version` e `uv --version`. Se o erro for no HyperFrames, a versão que está no package.json do projeto (por exemplo hyperframes@0.8.181).
      render: text
      placeholder: |
        Ubuntu 24.04
        node v22.11.0
        ffmpeg version 6.1.1
        uv 0.9.5
        hyperframes@0.8.181
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Mais contexto
      description: Preset de plataforma, motor de voz, se o `hyperframes check` passou, o que você já tentou.

  - type: checkboxes
    id: privacy
    attributes:
      label: Conferi
      options:
        - label: Tirei do texto acima chaves, tokens e dados pessoais.
          required: true
